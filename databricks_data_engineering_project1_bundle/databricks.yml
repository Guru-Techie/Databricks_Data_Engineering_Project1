# This is a Declarative Automation Bundle definition for databricks_data_engineering_project1_bundle.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: databricks_data_engineering_project1_bundle
  uuid: dd0db50c-4091-4c0f-a0d5-cd908bc5c091

include:
  - resources/*.yml

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
  schema:
    description: The schema to use
  warehouse_id:
    description: WarehouseID
targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://dbc-ce364460-138e.cloud.databricks.com
    variables:
      catalog: enviproj_dev
      schema: dev
      warehouse_id: d563bf6a5c2c284f
    presets:
      artifacts_dynamic_version: true
  prod:
    mode: production
    workspace:
      host: https://dbc-ce364460-138e.cloud.databricks.com
      # We explicitly deploy to /Workspace/Users/gururajvenkatesh2002@gmail.com to make sure we only have a single copy.
      root_path: /Workspace/Databricks_Data_Engineering_Project1}
    variables:
      catalog: enviproj_prod
      schema: prod
      warehouse_id: d563bf6a5c2c284f
    permissions:
      - user_name: gururajvenkatesh2002@gmail.com
        level: CAN_MANAGE
